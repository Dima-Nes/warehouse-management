<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Система управления складом</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="login-wrapper">
    <div class="card login-card p-4">
        <div class="card-body">
            <div class="text-center mb-4">
                <i class="bi bi-boxes fs-1 text-primary"></i>
                <h4 class="mt-2 fw-bold">Система управления складом</h4>
                <p class="text-muted small">Войдите для продолжения</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                <div class="alert alert-danger py-2">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <p class="text-center text-muted">
                Форма входа будет реализована на Дне 9.
            </p>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
